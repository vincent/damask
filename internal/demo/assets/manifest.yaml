    description: "Baspa River is a river flowing through the Indian Himalayas in the northern Indian state of Himachal Pradesh. It rises near the Indo-Tibetan border and forms the scenic Baspa Valley before flowing into the Sutlej River from the left bank near Karchham, where the Karcham Wangtoo Hydroelectric Plant is located on it."

  - name: landscape-mountain.jpg
