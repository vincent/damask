    fields:
      photographer: "Sarah M."
      usage_rights: "+180d"
      status: "Approved"
    alt: "Deep rocky sinkhole opening into a dark cave mouth on a high alpine plateau, with hikers standing at its rim for scale."
    description: "A cenote is a natural pit, or sinkhole, resulting when a collapse of limestone bedrock exposes groundwater. The term originated on the Yucatán Peninsula of Mexico, where the ancient Maya commonly used cenotes for water supplies, and occasionally for sacrificial offerings. The name derives from a word used by the lowland Yucatec Maya—tsʼonoʼot—to refer to any location with accessible groundwater."

  - name: landscape-volcano.jpg
    file: photos/landscape-volcano.jpg
    project: summer
    folder: photo
    mime: image/jpeg
    width: 1920
    height: 1070
    tags: [photography, approved]
    fields:
      photographer: "Sarah M."
      usage_rights: "+180d"
      status: "Approved"
    alt: "Mount Teide's volcanic peak and caldera seen from the northeast under clear skies."
    description: "Teide or Mount Teide is an active stratovolcano on the Spanish island of Tenerife, part of the Canary Islands. Its summit is the highest point in Spain and the highest of any island in the Atlantic Ocean. Measured from its base on the ocean floor, Teide reaches a total height of 7,500 m (24,600 ft), making it the third-tallest volcano in the world; UNESCO and NASA also rank it as Earth's third-tallest volcanic structure. Its elevation above sea level makes Tenerife the tenth-highest island in the world."

