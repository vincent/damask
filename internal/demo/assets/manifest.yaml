      usage_rights: "+180d"
      status: "Approved"
    alt: "Aerial view of Victoria Falls cascading into the gorge below on the Zambezi River."
    description: "Victoria Falls is a waterfall on the Zambezi River, located on the border between Zambia and Zimbabwe. It is one of the world's largest waterfalls, with a width of 1,708 m (5,604 ft). The region around it has a high degree of biodiversity in both plants and animals."

  - name: landscape-cenote.jpg
    file: photos/landscape-cenote.jpg
    project: summer
    folder: photo
