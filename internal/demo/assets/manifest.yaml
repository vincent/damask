# Demo asset manifest (ROADMAP.79 RA-1).
#
# Each entry describes one seeded asset: where its bytes come from, which
# project/folder it belongs to, and the tags/fields/alt text that must match
# what's actually in the file. `file` entries are embedded verbatim from this
# directory (photos/, videos/); `generator` entries are produced in Go at
# seed time (wireframes, PDFs, SVG, ZIP — content that isn't photography).
#
# Valid `project` keys: brand, summer, website, archive
# Valid `folder` keys (project-scoped, see seeder.go seedFolders): "" (project
#   root), logos, colors, photo, video, social, wireframes, ui, exports, printready
# Valid `tags` (fixed vocabulary, DM-1.6): approved, hero, social, print, web,
#   draft, archive, photography, video, brand
# Valid `fields` keys (asset scope, DM-1.4): client, status, usage_rights,
#   photographer, licensed. `usage_rights` accepts a relative offset like
#   "+180d" / "-365d" (from seed time) or literal will error.

assets:
  # --- Brand Identity ---
  - name: logo-primary-light.png
    file: photos/logo-primary-light.png
    project: brand
    folder: logos
    mime: image/png
    width: 512
    height: 512
    tags: [brand, approved]
    fields:
      client: "Sportswear Co"
      status: "Approved"
      licensed: "true"
    alt: "Abstract chevron monogram brand mark in orange and indigo on a white background."
    versions:
      - comment: "Rounded corners per feedback"
      - comment: "Final — approved by client"

