    description: "Mount Shasta is a potentially active stratovolcano at the southern end of the Cascade Range in Siskiyou County, California. At an elevation of 14,179 ft (4,322 m), it is the second-highest peak in the Cascades and the fifth-highest in the state. Mount Shasta has an estimated volume of 85 cubic miles, which makes it the most voluminous stratovolcano in the Cascade Volcanic Arc.\nThe mountain and surrounding area are part of the Shasta–Trinity National Forest."

